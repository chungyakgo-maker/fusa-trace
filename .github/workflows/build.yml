# 테스트 → Windows 설치 파일 빌드 → 실행 확인 → (새 버전이면) Release
#
# - push / Pull Request / 수동 실행: 테스트 + 설치 파일 빌드 + 실행 확인 → Actions 아티팩트
# - main에서, package.json 버전(v0.0.1 등)의 Release가 아직 없으면: Release와 태그를 만들어 설치 파일을 올림
#   → 마일스톤이 끝나면 package.json 버전을 올려서 main에 push하면 된다 (태그를 직접 push하지 않음)
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (타입 검사 · 단위 테스트 · 빌드)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # 이 단계는 Electron 실행 파일이 필요 없음

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 테스트
        run: npm test

      - name: 빌드
        run: npm run build

  windows:
    name: Windows 설치 파일 빌드 · 실행 확인
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 버전 확인
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 패키지 설치
        run: npm ci

      - name: 설치 파일 빌드 (Setup · Portable · zip)
        run: npm run dist:win

      - name: 가짜 테스트 문서 만들기
        run: npm run fixtures

      - name: 실행 확인 (빌드된 exe를 띄워서 메뉴 · 외부 요청 0건 확인)
        env:
          SMOKE_EXE: dist/win-unpacked/FuSaTrace.exe
          SMOKE_SCREENSHOT: dist/smoke/screenshot.png
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee smoke.txt
          {
            echo "## 실행 확인 (v${{ steps.meta.outputs.version }})"
            echo '```'
            grep -E '^(✓|✗)|실행 확인' smoke.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 업데이트 설치 확인 (설치형 설치 → 앱에서 업데이트 → 다시 켜짐)
        run: |
          set -o pipefail
          node tests/smoke/update-install.mjs 2>&1 | tee update.txt
          {
            echo "## 업데이트 설치 확인"
            echo '```'
            grep -E '^(✓|✗|- )|확인 (통과|실패)' update.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 파일 목록
        run: |
          {
            echo "## 설치 파일"
            echo '| 파일 | 크기 |'
            echo '|---|---|'
            for f in dist/*.exe dist/*.zip; do
              echo "| $(basename "$f") | $(( $(stat -c %s "$f") / 1024 / 1024 )) MB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 아티팩트 - 설치형 (Setup.exe)
        uses: actions/upload-artifact@v7
        with:
          name: FuSaTrace-${{ steps.meta.outputs.version }}-Setup
          path: dist/FuSaTrace-*-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: 아티팩트 - 포터블 (Portable.exe)
        uses: actions/upload-artifact@v7
        with:
          name: FuSaTrace-${{ steps.meta.outputs.version }}-Portable
          path: dist/FuSaTrace-*-Portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: 아티팩트 - 압축본 (zip)
        uses: actions/upload-artifact@v7
        with:
          name: FuSaTrace-${{ steps.meta.outputs.version }}-win-x64-zip
          path: dist/FuSaTrace-*-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: 아티팩트 - 실행 확인 화면 캡처
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshot
          path: dist/smoke/*.png
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Release 올리기
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.windows.outputs.version }}
    steps:
      - name: 이미 있는 버전인지 확인
        id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$TAG Release가 이미 있어서 건너뜁니다. 새 Release를 만들려면 package.json 버전을 올리세요."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 설치 파일 받기
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          pattern: FuSaTrace-*
          path: release
          merge-multiple: true

      - name: Release 만들기
        if: steps.check.outputs.exists == 'false'
        run: |
          cd release
          ls -la
          sha256sum *.exe *.zip > SHA256SUMS.txt
          v="${TAG#v}"
          cat > notes.md <<EOF
          ## 설치 파일 (하나만 받으면 됩니다)

          | 파일 | 설명 |
          |---|---|
          | \`FuSaTrace-${v}-Setup.exe\` | **설치형 (권장)**. 관리자 권한 없이 내 계정에만 설치됩니다. 바탕화면·시작 메뉴에 바로가기가 생깁니다. |
          | \`FuSaTrace-${v}-Portable.exe\` | 설치 없이 실행. 실행할 때마다 임시 폴더에 풀려서 시작이 조금 느립니다. |
          | \`FuSaTrace-${v}-win-x64.zip\` | 원하는 폴더에 압축을 풀고 \`FuSaTrace.exe\` 실행. 위 두 가지가 막힐 때 사용합니다. |

          - 코드 서명이 없는 파일이라 처음 실행할 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요.
          - 앱은 업데이트 확인(GitHub) 말고는 인터넷에 연결하지 않습니다. 문서·프로젝트 내용은 보내지 않고, 통계 수집도 없습니다.
          - v0.6.0부터는 앱의 **설정 → 업데이트**에서 새 버전을 확인하고 받을 수 있습니다 (앱을 켤 때 자동 확인, 설정에서 끌 수 있음).
          - \`SHA256SUMS.txt\`: 파일이 손상되지 않았는지 확인하는 값입니다. 앱의 업데이트도 이 값과 맞을 때만 설치합니다.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FuSa Trace $TAG" \
            --notes-file notes.md \
            ./*.exe ./*.zip SHA256SUMS.txt
