# 테스트 → Windows 설치 파일 빌드 → 실행 확인 → (태그면) Release
#
# - main에 push / Pull Request / 수동 실행: 테스트 + 설치 파일 빌드 → Actions 아티팩트
# - v로 시작하는 태그(v0.0.1 등) push: 위와 같고, Release 페이지에도 설치 파일을 올림
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: 테스트 (타입 검사 · 단위 테스트 · 빌드)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # 이 단계는 Electron 실행 파일이 필요 없음

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 테스트
        run: npm test

      - name: 빌드
        run: npm run build

  windows:
    name: Windows 설치 파일 빌드 · 실행 확인
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 버전 확인
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전($version)이 다릅니다"
            exit 1
          fi

      - name: 패키지 설치
        run: npm ci

      - name: 설치 파일 빌드 (Setup · Portable · zip)
        run: npm run dist:win

      - name: 실행 확인 (빌드된 exe를 띄워서 메뉴 · 외부 요청 0건 확인)
        env:
          SMOKE_EXE: dist/win-unpacked/FuSaTrace.exe
          SMOKE_SCREENSHOT: dist/smoke/screenshot.png
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee smoke.txt
          {
            echo "## 실행 확인 (v${{ steps.meta.outputs.version }})"
            echo '```'
            grep -E '^(✓|✗)|실행 확인' smoke.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 파일 목록
        run: |
          {
            echo "## 설치 파일"
            echo '| 파일 | 크기 |'
            echo '|---|---|'
            for f in dist/*.exe dist/*.zip; do
              echo "| $(basename "$f") | $(( $(stat -c %s "$f") / 1024 / 1024 )) MB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 아티팩트 - 설치형 (Setup.exe)
        uses: actions/upload-artifact@v7
        with:
          name: FuSaTrace-${{ steps.meta.outputs.version }}-Setup
          path: dist/FuSaTrace-*-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: 아티팩트 - 포터블 (Portable.exe)
        uses: actions/upload-artifact@v7
        with:
          name: FuSaTrace-${{ steps.meta.outputs.version }}-Portable
          path: dist/FuSaTrace-*-Portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: 아티팩트 - 압축본 (zip)
        uses: actions/upload-artifact@v7
        with:
          name: FuSaTrace-${{ steps.meta.outputs.version }}-win-x64-zip
          path: dist/FuSaTrace-*-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: 아티팩트 - 실행 확인 화면 캡처
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshot
          path: dist/smoke/screenshot.png
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Release 올리기
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 설치 파일 받기
        uses: actions/download-artifact@v8
        with:
          pattern: FuSaTrace-*
          path: release
          merge-multiple: true

      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          ls -la
          sha256sum *.exe *.zip > SHA256SUMS.txt
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## 설치 파일 (하나만 받으면 됩니다)

          | 파일 | 설명 |
          |---|---|
          | \`FuSaTrace-${v}-Setup.exe\` | **설치형 (권장)**. 관리자 권한 없이 내 계정에만 설치됩니다. 바탕화면·시작 메뉴에 바로가기가 생깁니다. |
          | \`FuSaTrace-${v}-Portable.exe\` | 설치 없이 실행. 실행할 때마다 임시 폴더에 풀려서 시작이 조금 느립니다. |
          | \`FuSaTrace-${v}-win-x64.zip\` | 원하는 폴더에 압축을 풀고 \`FuSaTrace.exe\` 실행. 위 두 가지가 막힐 때 사용합니다. |

          - 코드 서명이 없는 파일이라 처음 실행할 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요.
          - 앱은 인터넷에 연결하지 않습니다 (자동 업데이트·통계 수집 없음).
          - \`SHA256SUMS.txt\`: 파일이 손상되지 않았는지 확인하는 값입니다.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FuSa Trace ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            ./*.exe ./*.zip SHA256SUMS.txt
